type Holder @entity(immutable: false) {
  id: Bytes!
  balance: BigInt!
  transfersSent: [Transfer!]! @derivedFrom(field: "from")
  transfersReceived: [Transfer!]! @derivedFrom(field: "to")
}

type Transfer @entity(immutable: true) {
  id: Bytes!
  from: Holder!
  to: Holder!
  value: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}
