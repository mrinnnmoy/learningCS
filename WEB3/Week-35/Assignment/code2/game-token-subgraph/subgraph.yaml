specVersion: 1.3.0
indexerHints:
  prune: auto

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: GameToken
    network: sepolia
    source:
      address: "0x340Ac35821b9F6D1321E013A1C353B8ECac9f7fF"
      abi: GameToken
      startBlock: 11487401

    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript

      entities:
        - Holder
        - Transfer

      abis:
        - name: GameToken
          file: ./abis/GameToken.json

      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer

      file: ./src/game-token.ts
