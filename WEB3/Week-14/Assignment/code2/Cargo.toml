[package]
name = "code2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
borsh = "1.5.5"
solana-program = "3"
solana-system-interface = "2"

[dev-dependencies]
solana-program-test = "3"
solana-sdk = "3"
tokio = { version = "1", features = ["full"] }
