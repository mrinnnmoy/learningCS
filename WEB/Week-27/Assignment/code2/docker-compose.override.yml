# This file is automatically merged by Docker Compose in local development.
# It adds volume mounts for hot reload without modifying the production compose file.
version: "3.9"

services:
  app:
    # Build from local source instead of a registry image
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    # Mount source code so changes appear without rebuilding the image
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
