name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Turborepo remote cache — set these in GitHub repo secrets
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for --filter=[origin/main]

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint only packages affected by this PR's changes
      - name: Lint (affected)
        run: pnpm turbo lint --filter=[origin/main]

      # Typecheck only affected packages
      - name: Typecheck (affected)
        run: pnpm turbo typecheck --filter=[origin/main]

      # Build everything — uses remote cache for unchanged packages
      # This is near-instant on CI if nothing changed
      - name: Build (all)
        run: pnpm turbo build

      # Output summary of what was cached vs rebuilt
      - name: Cache summary
        run: pnpm turbo build --dry-run 2>&1 | tail -5
        if: always()
